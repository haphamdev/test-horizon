# Edge proxy for the multi-region simulation.
#
# Routes by Host header to the matching region, and by path within a region:
#   /horizon, /vendor/horizon  -> the region's dedicated Horizon dashboard app
#   everything else            -> the region's user/API Laravel app
#
# proxy_pass targets are built from variables so nginx resolves them at request
# time via Docker's embedded DNS (127.0.0.11). This lets the proxy start even
# when the profiled dash-* containers are absent: requests to /horizon then
# return a graceful 502 instead of nginx refusing to boot.

resolver 127.0.0.11 valid=10s ipv6=off;

# ---- US region --------------------------------------------------------------
server {
    listen 80;
    server_name us.test-horizon.com;

    location /horizon {
        set $dash http://dash-us:8000;
        proxy_pass $dash$request_uri;
        include /etc/nginx/proxy.conf;
    }

    location /vendor/horizon {
        set $dash http://dash-us:8000;
        proxy_pass $dash$request_uri;
        include /etc/nginx/proxy.conf;
    }

    location / {
        set $app http://app-us:8000;
        proxy_pass $app$request_uri;
        include /etc/nginx/proxy.conf;
    }
}

# ---- ASIA region ------------------------------------------------------------
server {
    listen 80;
    server_name asia.test-horizon.com;

    location /horizon {
        set $dash http://dash-asia:8000;
        proxy_pass $dash$request_uri;
        include /etc/nginx/proxy.conf;
    }

    location /vendor/horizon {
        set $dash http://dash-asia:8000;
        proxy_pass $dash$request_uri;
        include /etc/nginx/proxy.conf;
    }

    location / {
        set $app http://app-asia:8000;
        proxy_pass $app$request_uri;
        include /etc/nginx/proxy.conf;
    }
}

# ---- Unknown host -----------------------------------------------------------
# Drop requests that don't target a known region subdomain.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
